[package]
name = "verbix-shell"
version = "0.1.0"
description = "Verbix desktop shell"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "verbix_shell"
path = "src/lib.rs"

[[bin]]
name = "verbix-shell"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
