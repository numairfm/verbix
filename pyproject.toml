[project]
name = "verbix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Numair Mazloum", email = "numairfmazloum@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.13.0",
    "jinja2>=3.1.0",
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
    "num2words>=0.5.14",
    "numpy>=1.26.0",
    "pillow>=12.3.0",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "sherpa-onnx>=1.12.0",
    "sherpa-onnx-core>=1.12.0",
    "sounddevice>=0.5.6",
    "tenacity>=9.0.0",
]

[project.scripts]
verbix = "verbix:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

