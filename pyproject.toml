[project]
name = "verbix"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Numair Mazloum", email = "numairfmazloum@gmail.com" }
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "dbus-fast>=4.0.0; sys_platform == 'linux'",
    "jinja2>=3.1.0",
    "litellm>=1.75.5,!=1.82.7,!=1.82.8",
    "num2words>=0.5.14",
    "numpy>=1.26.0",
    "pathspec>=0.12.1",
    "pillow>=12.3.0",
    "psutil>=6.0.0",
    "pulsectl>=24.0.0; sys_platform == 'linux'",
    "pycaw>=20240210; sys_platform == 'win32'",
    "pydantic>=2.12",
    "pyperclip>=1.9.0",
    "pyyaml>=6.0",
    "sherpa-onnx>=1.12.0",
    "sherpa-onnx-core>=1.12.0",
    "sounddevice>=0.5.6",
    "tenacity>=9.0.0",
    "transcribe-cpp>=0.4.0",
]

[project.scripts]
verbix = "verbix:main"

[build-system]
requires = []
build-backend = "verbix._build_backend"
backend-path = ["src"]

[tool.uv.build-backend]
source-include = ["src/verbix/voice/tts/supertonic-int8/**"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

