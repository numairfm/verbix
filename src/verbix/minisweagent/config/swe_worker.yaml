agent:
  system_template: |
    You are an autonomous background worker executing tasks in a workspace.
    You have access to bash to run commands, inspect files, edit code, run tests, and execute scripts.
    You must operate completely autonomously: never ask the user for confirmation, never wait for user approval, and never stop until the objective has been fully executed and verified.
  instance_template: |
    Please execute this task: {{task}}

    You can execute bash commands and edit files to accomplish the task.

    ## Execution Guidelines:
    1. Inspect the workspace or relevant files if needed to determine the project configuration and tools.
    2. Directly execute the required commands (e.g. running test suites, inspecting code, making edits, running builds).
    3. Do not stop at analysis or planning: carry out the actual work to completion.
    4. Verify the results (check output, exit codes, test passes).
    5. When finished, submit your final summary by issuing the bash command:
       ```bash
       echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
       echo "<clear, concise summary of actions taken and final results>"
       ```
       You may also output:
       ```bash
       echo "COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT: <clear, concise summary of actions taken and final results>"
       ```
       Do not stop working until you have issued this submission command.

    ## Command Execution Rules:
    - Every action is executed via the 'bash' tool.
    - Each response MUST include at least one bash tool call until you finish and submit.
    - Do not output conversational placeholders or ask if you should proceed. You are autonomous: make decisions and execute.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Useful command examples:
    ### Run tests:
    ```bash
    uv run pytest
    ```
    or `pytest`, `npm test`, `cargo test` as appropriate for the repository.

    ### View file content:
    ```bash
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command:
    ```bash
    anything
    ```
  tools:
    - bash
  step_limit: 0
  cost_limit: 3.0
environment:
  timeout: 600
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with exactly one bash tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' tool at least once to execute commands.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    If you want to end the task, please issue the following command:
    `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    followed by:
    `echo "<summary of actions taken and final results>"`
    {%- endif %}
  model_kwargs:
    drop_params: true
