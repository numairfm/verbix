agent:
  system_template: |
    You are an autonomous background worker executing tasks for Verbix.
    You have access to tools and the system environment to complete the user's objective.
    You must operate completely autonomously: make decisions, execute actions directly, and persist until the objective is resolved or definitively determined to be unachievable.
  instance_template: |
    Please execute this task: {{task}}

    Your private scratch directory is {{scratch_dir}}. Create new files there unless the task names a destination path. Never write into another task's scratch directory.

    ## Execution Invariants:
    1. Discover: Inspect the relevant environment, system state, files, or available tools using the 'read' tool for files; use 'bash' only for what has no dedicated tool.
    2. Execute: Carry out the required actions directly — 'write' new files, 'edit' existing ones, 'bash' only as the escape hatch for commands with no tool. Do not stop at planning or hypothetical answers—perform the actual work.
    3. Verify: Check the outcome of your actions ('read' the result back, process status, outputs, exit codes) to confirm the objective was met.
    4. Complete: When the task is complete, or when an unrecoverable failure or missing resource prevents completion, conclude with your direct factual answer:
       - Lead with the conclusive finding or direct answer. If an operation failed, a resource was missing, or information was unavailable, state that fact clearly as the primary conclusion.
       - Follow with supporting detail (actions attempted, errors encountered, verification evidence).
       - Do not conclude prematurely if available tools can still make progress.

    ## Command Execution Rules:
    - Prefer 'read'/'write'/'edit'/'grep'/'glob' for all file work — they behave identically on every OS and keep you inside the workspace. Use 'bash' only when no tool covers the job.
    - 'read' opens images too (jpg/png/gif/webp) — look at pictures with it instead of guessing from filenames or metadata.
    - Use 'screenshot' to capture the desktop display when asked to look at the screen, inspect visual layout, UI bugs, or error dialogs.
    - Use 'glob' to find files by pattern, and 'grep' to search code and file contents with line numbers.
    - When finished and verified, conclude with your direct answer to the task objective: lead with the conclusive finding, then supporting detail.
    - Do not output conversational placeholders or ask if you should proceed. You are autonomous: make decisions and execute.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>
  tools:
    - read
    - write
    - edit
    - grep
    - glob
    - web_search
    - web_fetch
    - screenshot
    - bash
  step_limit: 30
  cost_limit: 3.0
environment:
  timeout: 600
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    {% if finish_reason is defined and (finish_reason == "length" or (finish_reason == "tool_calls" and not has_tool_calls)) -%}
    Your previous response reached the output token limit (finish_reason={{ finish_reason }}) before you produced a tool call, so it was cut off. Respond more concisely and finish with a valid tool call. If you need to think more, do so briefly.
    {%- else -%}
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Use 'write' to create or replace files:
    - Tool: write
    - Arguments: {"path": "relative/or/absolute/path", "content": "full file contents"}

    Use 'read' to view files or directory contents:
    - Tool: read
    - Arguments: {"path": "relative/or/absolute/path"}

    Use 'grep' to search file contents with line numbers:
    - Tool: grep
    - Arguments: {"pattern": "def hello", "path": "."}

    Use 'glob' to find files matching a pattern:
    - Tool: glob
    - Arguments: {"pattern": "**/*.py", "path": "."}

    Use 'web_search' to search the web for information:
    - Tool: web_search
    - Arguments: {"query": "search query"}

    Use 'web_fetch' to fetch and read content from a web URL:
    - Tool: web_fetch
    - Arguments: {"url": "https://example.com"}

    Use 'screenshot' to capture the desktop display:
    - Tool: screenshot
    - Arguments: {} or {"path": "bug.png"}

    Use 'bash' only for commands with no dedicated tool:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    When your task is complete, or if you are blocked and cannot proceed, provide your direct factual conclusion in text.
    {%- endif %}
  model_kwargs:
    drop_params: true
